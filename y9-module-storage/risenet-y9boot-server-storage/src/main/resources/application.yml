management:
    endpoints:
        web:
            exposure:
                include: health
    endpoint:
        health:
            probes:
                enabled: true
server:
    port: 8080
    servlet:
        encoding:
            charset: UTF-8
            enabled: true
            force: true
        session:
            tracking-modes: COOKIE
        context-path: /server-storage
        register-default-servlet: true
spring:
    application:
        name: storage
    aop:
        auto: false
        proxy-target-class: true
    autoconfigure:
        exclude:
            - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
            - org.springframework.boot.autoconfigure.quartz.QuartzAutoConfiguration
            - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
            - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
            # 需要使用 kafka 时注释掉让其能自动配置
            - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
    cloud:
        nacos:
            server-addr: http://localhost:8500
            username: nacos
            password: ${NACOS_PASSWORD:111111}
            config:
                enabled: false
                group: DEFAULT_GROUP
                namespace: test
            discovery:
                enabled: false
                group: DEFAULT_GROUP
                namespace: test
    config:
        import:
            - optional:nacos:storage.yml
            #- optional:nacos:test01.yml?group=group_02
            #- optional:nacos:test02.yml?group=group_03&refreshEnabled=false
    datasource:
        type: com.alibaba.druid.pool.DruidDataSource
        druid:
            filter:
                stat:
                    log-slow-sql: true
                    slow-sql-millis: 2000
                wall:
                    config:
                        drop-table-allow: false
                    enabled: true
            stat-view-servlet:
                allow: 10.168.18.1/24,10.168.12.1/24
                enabled: true
                login-password: '83204585'
                login-username: y9admin
                reset-enable: false
                url-pattern: /druid/*
            web-stat-filter:
                enabled: true
                exclusions: '*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*,/static/*'
                url-pattern: /*
            connectionProperties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
            y9-public:
                #driver-class-name: oracle.jdbc.OracleDriver
                #url: jdbc:oracle:thin:@127.0.0.1:1521:orcl
                #username: Y9_PUBLIC
                driver-class-name: com.mysql.cj.jdbc.Driver
                url: jdbc:mysql://localhost:3306/y9_public?serverTimezone=GMT%2B8&nullCatalogMeansCurrent=true&useUnicode=true&characterEncoding=utf-8&rewriteBatchedStatements=true&useCompression=true&useSSL=false
                username: root
                password: '111111'
                initialSize: 1
                maxActive: 20
                maxPoolPreparedStatementPerConnectionSize: 100
                maxWait: 60000
                minEvictableIdleTimeMillis: 300000
                minIdle: 1
                poolPreparedStatements: true
                testOnBorrow: false
                testOnReturn: false
                testWhileIdle: true
                timeBetweenEvictionRunsMillis: 60000
                useGlobalDataSourceStat: true
                validationQuery: SELECT 1 FROM DUAL
    jpa:
        hibernate:
            naming:
                implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyHbmImpl
                physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        open-in-view: false
        properties:
            hibernate:
                cache:
                    use_query_cache: false
                    use_second_level_cache: false
                dialect: org.hibernate.dialect.MySQL8Dialect
                hbm2ddl:
                    auto: none
                jdbc:
                    batch_size: 100
                show_sql: true
    kafka:
        bootstrap-servers: localhost:9092
        consumer:
            auto-commit-interval: 1000
            enable-auto-commit: true
            group-id: y9storage-server
    main:
        allow-bean-definition-overriding: true
    mvc:
        view:
            prefix: /WEB-INF/jsp/
            suffix: .jsp
    servlet:
        multipart:
            max-file-size: 2048MB
            max-request-size: 2048MB
    redis:
        database: 8
        host: localhost
        password: '111111'
        port: 6379
        lettuce:
            pool:
                max-active: 8
                max-idle: 8
                max-wait: -1
                min-idle: 0
            shutdown-timeout: 100ms
        ssl: false
        timeout: 10000
# ==================== AI 大模型配置 ====================
# 支持所有 OpenAI 兼容协议的大模型服务。
# 只需修改 enabled=true 并填对应 api-key 即可启用。
#
# ┌─────────────────────────────────────────────────────────────┐
# │  推荐免费方案（按推荐优先级排序）                              │
# ├─────────────────────────────────────────────────────────────┤
# │                                                             │
# │ ① 智谱AI GLM-4-Flash — 永久免费，每月100万tokens，OpenAI兼容 │
# │    注册: https://open.bigmodel.cn  → 右上角「API密钥」         │
# │    base-url: https://open.bigmodel.cn/api/paas/v4            │
# │    model: glm-4-flash                                        │
# │                                                             │
# │ ② DeepSeek — 新用户送500万tokens，中文能力强                  │
# │    注册: https://platform.deepseek.com → API Keys            │
# │    base-url: https://api.deepseek.com/v1                     │
# │    model: deepseek-chat                                      │
# │                                                             │
# │ ③ 硅基流动 SiliconFlow — 新用户送额度，聚合多模型              │
# │    注册: https://cloud.siliconflow.cn → API密钥               │
# │    base-url: https://api.siliconflow.cn/v1                   │
# │    model: deepseek-ai/DeepSeek-V3                            │
# │                                                             │
# │ ④ 阿里通义千问 — 每月200万tokens免费                          │
# │    注册: https://bailian.console.aliyun.com → API-KEY        │
# │    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1│
# │    model: qwen-turbo                                         │
# │                                                             │
# │ ⑤ 本地Ollama — 完全免费，无需注册                             │
# │    安装: ollama pull qwen2.5:7b                              │
# │    base-url: http://localhost:11434/v1                       │
# │    model: qwen2.5:7b                                         │
# │    api-key: ollama                                           │
# └─────────────────────────────────────────────────────────────┘
#
# 如果以上都不行，可用大模型聚合中转服务，一个key调用所有模型。
# 比如 openllmapi.com 或 freellmapi（GitHub开源自建）
ai:
    enabled: true
    base-url: http://localhost:11434/v1
    api-key: ollama
    model: qwen2.5:7b
    max-tokens: 2000
    temperature: 0.7
    connect-timeout: 30000
    read-timeout: 120000
    system-prompt: '你是一个专业的文件管理助手，帮助用户管理网盘文件。你可以帮助用户查找文件、分析文件内容、提取文件信息、进行数据对比等。回答要简洁、准确，使用中文。'
    index-on-upload: true
    indexable-extensions: 'txt,csv,json,xml,md,log,java,py,js,ts,html,css,sql,yml,yaml,properties'
    max-content-length: 10000

# Tesseract OCR 图片文字识别（本地备选引擎）
tesseract:
    install-path: D:/Program Files/Tesseract-OCR

# 腾讯云 OCR 图片文字识别（推荐主用，云端识别率高）
tencent-ocr:
    # 是否启用腾讯云 OCR（启用后优先使用，未配置密钥或失败时回退到 Tesseract）
    enabled: false
    # 腾讯云 API 密钥（https://console.cloud.tencent.com/cam/capi）
    secret-id: YOUR_SECRET_ID_HERE
    secret-key: YOUR_SECRET_KEY_HERE
    # OCR 接口区域（ap-guangzhou / ap-shanghai / ap-beijing）
    region: ap-guangzhou
    # 调用超时（秒）
    timeout: 30

y9:
    systemName: storage
    internalIp: 192.168.x.x,10.x.x.x,172.20.x.x
    app:
        storage:
            #单次上传限制/字节 120Mb
            singleUploadLimit: 125829120
            #默认存储容量/字节
            defaultStorageCapacity: 5368709120
            fileManagerSystemName: itemAdmin
            publicManagerRoleName: 公共文件管理角色
            capacityManagerRoleName: 存储空间管理角色
            reportManagerRoleName: 文件上报管理角色
            tagManagerRoleName: 标签管理角色
            productDocument: 95b19opvx9d40458c002dd61c41eb2c
    service:
        org:
            directUrl: http://localhost:7055
        log:
            directUrl: http://localhost:7055
    common:
        kafkaEnabled: false
        orgBaseUrl: http://localhost:7055/server-platform
        jodconverterBaseUrl: http://localhost:7055/jodconverter/onlinePreview?url=
        # 后端访问链接
        storageBaseUrl: http://localhost:7080/server-storage
        #前端文件拼接链接
        vueStorageBaseUrl: http://localhost:8080/storage
        logBaseUrl: http://localhost:7055/server-log
        userOnlineBaseUrl: http://localhost:7056/server-useronline
    feature:
        file:
            base64FileName: false
            encryptionFileContent: false
            #privateKey:
            #publicKey:
            rest:
                fileManagerUrl: http://test-api.youshengyun.com/filemanager
            ftp:
                enabled: true
                host: localhost
                port: 21
                username: y9admin
                password: '111111'
                blockWhenExhausted: true
                bufferSize: 10240
                connectTimeOut: 50000
                controlEncoding: UTF-8
                dataTimeout: 1200000
                fileType: 2
                maxIdle: 10
                maxTotal: 50
                minIdle: 2
                maxWaitMillis: 5400000
                testOnBorrow: true
                testOnCreate: true
                testOnReturn: true
                testWhileIdle: true
                useEPSVwithIPv4: false
                passiveMode: true
            local:
                enabled: false
                # 本地文件存储的根路径，按需设置为自己的
                basePath: "d:/y9config/y9filestore"
        jpa:
            packagesToScanEntityPublic: net.risesoft.y9public.entity
            packagesToScanEntityTenant: net.risesoft.entity
            packagesToScanRepositoryPublic: net.risesoft.y9public.repository
            packagesToScanRepositoryTenant: net.risesoft.repository
        liquibase:
            tenant-enabled: true
        multi-tenant:
            # kafka, db
            event-source: db
        log:
            enabled: true
            # kafka, api
            reportMethod: api
        session:
            redis:
                enabled: true
                maxInactiveIntervalInSeconds: 3600
        security:
            enabled: true
            csrf:
                accepted-referer:
                    - youshengyun.com
                    - localhost
                    - 127.0.0.1
            cors:
                allowCredentials: true
                allowed-headers: '*'
                allowedOriginPatterns:
                    - https://*.youshengyun.com
                    - http://*.youshengyun.com
                    - http://localhost:7055
                    - http://localhost:7056
                    - http://localhost:7058
                    - http://localhost:8080
                    - http://localhost:8081
                    - http://localhost:8082
                    - http://localhost:8083
                    - http://localhost:7080
                    - http://127.0.0.1:7055
                    - http://127.0.0.1:7056
        oauth2:
            resource:
                enabled: true
                allowBasicAuthentication: true
                allowFormEncodedBodyParameter: true
                allowUriQueryParameter: true
                protectedUrlPatterns: /vue/*
                opaque:
                    client-id: clientid_oidc
                    client-secret: secret_oidc
                    introspection-uri: http://localhost:7055/sso/oidc/introspect
                    profile-uri: http://localhost:7055/sso/oidc/profile
